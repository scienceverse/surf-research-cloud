# Managed by the metacheck SURF Research Cloud component (scienceverse/surf-research-cloud).
# Per-visitor limits while the app and web interface are public. Only POST
# requests count; other requests get an empty key, which nginx does not limit.
map $request_method $metacheck_public_limit_key {
    POST    $binary_remote_addr;
    default "";
}
# The app: POST carries file uploads and Shiny's fallback transport; the
# normal websocket connection is not limited. 20 per minute, burst 40.
limit_req_zone $metacheck_public_limit_key zone=metacheck_public:10m rate=20r/m;
# The web interface (/api/): each request is a whole conversion and report.
# 6 per minute, burst 6.
limit_req_zone $metacheck_public_limit_key zone=metacheck_api:10m rate=6r/m;
