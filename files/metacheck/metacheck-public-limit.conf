# Managed by the metacheck SURF Research Cloud component (scienceverse/surf-research-cloud).
# Per-visitor limit for the public metacheck app: at most 20 POST requests per
# minute per IP address, burst 40. POST carries file uploads and Shiny's
# fallback transport; the normal websocket connection is not limited.
map $request_method $metacheck_public_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $metacheck_public_limit_key zone=metacheck_public:10m rate=20r/m;
