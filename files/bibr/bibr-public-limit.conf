# Managed by the bibr SURF Research Cloud component (scienceverse/surf-research-cloud).
# Per-visitor limit for bibr's public entrance (bibr-public.conf): at most
# 6 uploads per minute per IP address, with a burst of 10. Only POST requests
# count; other requests get an empty key, which nginx does not limit.
map $request_method $bibr_public_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $bibr_public_limit_key zone=bibr_public:10m rate=6r/m;
