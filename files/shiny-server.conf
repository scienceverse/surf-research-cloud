# Managed by the metacheck SURF Research Cloud component.
run_as shiny;
preserve_logs true;

server {
  listen 3838 127.0.0.1;

  # Each app under /srv/shiny-server/<name> is served at /<name>/.
  location / {
    site_dir /srv/shiny-server;
    log_dir /var/log/shiny-server;
    directory_index off;
    # A metacheck report can take several minutes; keep the session alive.
    app_idle_timeout 0;
    app_init_timeout 300;
  }
}
