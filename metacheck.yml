---
# metacheck on SURF Research Cloud
#
# Installs, on one GPU workspace:
#   * bibr serve + GLM-OCR + Redis (Docker Compose, from the bibr repository)
#   * R, Shiny Server and the metacheck package, with the paper report app
#   * nginx locations behind the SRAM login (only when SRC-Nginx is present)
#
# SRC runs this as root on the workspace itself:
#   ansible-playbook --connection=local -i localhost, -b --extra-vars="<parameters>" metacheck.yml
#
# Everything slow enough to exceed SRC's component time limit (building the
# bibr images, downloading the OCR model) runs in the background through the
# bibr-stack systemd service; progress is written to /var/log/metacheck/status.txt.

- name: metacheck + bibr on a SURF Research Cloud GPU workspace
  hosts: localhost
  gather_facts: false
  become: true

  vars:
    # ---- component parameters (all strings; SRC does not allow empty values,
    # so "none" means "not set"). Values passed by SRC as extra variables
    # override these defaults. ----
    metacheck_google_api_key: "none"
    metacheck_anthropic_api_key: "none"
    metacheck_openai_api_key: "none"
    # "ollama" runs a local model on the workspace GPU (no data leaves it);
    # "google", "anthropic" or "openai" use a cloud model with the key below.
    metacheck_llm_provider: "ollama"
    # Model for the chosen provider; for ollama this is the tag that is pulled.
    # A 4B model fits next to the OCR server on a 24 GB card.
    metacheck_llm_model: "qwen3.5:4b"
    metacheck_crossref_email: "none"
    metacheck_bibr_ref: "v0.7.3"
    metacheck_metacheck_repo: "scienceverse/metacheck"
    # dev is where metacheck is developed; main lags months behind.
    metacheck_metacheck_ref: "dev"
    metacheck_ocr_mem_fraction: "0.60"
    metacheck_max_upload: "100M"
    metacheck_start_bibr: "true"
    # Where Docker keeps images (the OCR image alone is 17 GB; building needs
    # about 90 GB). "auto" = first mounted SRC storage volume under /data,
    # else the ephemeral /mnt/scratch disk, else the boot disk.
    metacheck_docker_root: "auto"

    # ---- fixed settings ----
    metacheck_shiny_port: 3838
    metacheck_bibr_port: 8000
    metacheck_root: /opt/metacheck
    metacheck_bibr_dir: /opt/metacheck/bibr
    metacheck_secrets_dir: /etc/metacheck
    shiny_server_deb: https://download3.rstudio.org/ubuntu-20.04/x86_64/shiny-server-1.5.23.1030-amd64.deb
    quarto_version: "1.10.19"
    # CRAN packages metacheck and its app need, installed as Ubuntu binaries (r2u).
    r_packages:
      - r-cran-remotes
      - r-cran-shiny
      - r-cran-shinydashboard
      - r-cran-shinyjs
      - r-cran-dt
      - r-cran-dplyr
      - r-cran-tidyr
      - r-cran-readr
      - r-cran-knitr
      - r-cran-rmarkdown
      - r-cran-quarto
      - r-cran-bibtex
      - r-cran-ellmer
      - r-cran-jsonlite
      - r-cran-xml2
      - r-cran-curl
      - r-cran-httr2
      - r-cran-rvest
      - r-cran-rappdirs
      - r-cran-tidytext
      - r-cran-statcheck
      - r-cran-base64enc
      - r-cran-gitcreds
      - r-cran-roxygen2
      - r-cran-jpeg
      - r-cran-progress
      - r-cran-ggplot2
      # the paper report app runs each report in its own R process
      - r-cran-callr
      - r-cran-processx
      # optional packages that metacheck's data and codebook checks use
      - r-cran-careless
      - r-cran-readods
      - r-cran-openxlsx
      - r-cran-haven
      - r-cran-readxl
      - r-cran-data.table
      - r-cran-officer
      - r-cran-pdftools
      - r-cran-snowballc
      - r-cran-yaml
      - r-cran-dbi
      - r-cran-rsqlite
      - r-cran-zip
      - r-cran-digest

  tasks:
    - name: Wait for system to become reachable
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Gather facts
      ansible.builtin.setup:

    - name: Refuse anything but Ubuntu 22.04
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version == "22.04"
        fail_msg: "This component is built for the 'Ubuntu 2204 with CUDA' catalog item."

    - name: Check that an NVIDIA GPU is present
      ansible.builtin.command: nvidia-smi --query-gpu=name,memory.total --format=csv,noheader
      register: gpu_info
      changed_when: false

    - name: Show the GPU
      ansible.builtin.debug:
        msg: "GPU: {{ gpu_info.stdout }}"

    # ------------------------------------------------------------------
    # Directories and secrets
    # ------------------------------------------------------------------
    - name: Create directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ metacheck_root }}"
        - "{{ metacheck_root }}/bin"
        - /var/log/metacheck

    - name: Create secrets directory
      ansible.builtin.file:
        path: "{{ metacheck_secrets_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Generate secrets once (bibr bearer token, OCR token, Redis password)
      ansible.builtin.shell: openssl rand -hex 32 > {{ metacheck_secrets_dir }}/{{ item }} && chmod 0600 {{ metacheck_secrets_dir }}/{{ item }}
      args:
        creates: "{{ metacheck_secrets_dir }}/{{ item }}"
      loop:
        - bibr_api_key
        - ocr_api_key
        - redis_password

    - name: Read secrets
      ansible.builtin.slurp:
        src: "{{ metacheck_secrets_dir }}/{{ item }}"
      loop:
        - bibr_api_key
        - ocr_api_key
        - redis_password
      register: secret_files
      no_log: true

    - name: Set secret facts
      ansible.builtin.set_fact:
        metacheck_bibr_api_key: "{{ (secret_files.results[0].content | b64decode) | trim }}"
        metacheck_ocr_api_key: "{{ (secret_files.results[1].content | b64decode) | trim }}"
        metacheck_redis_password: "{{ (secret_files.results[2].content | b64decode) | trim }}"
      no_log: true

    - name: Write status file
      ansible.builtin.copy:
        dest: /var/log/metacheck/status.txt
        content: "{{ lookup('pipe', 'date \"+%Y-%m-%d %H:%M:%S\"') }}  component: installing system packages\n"
        mode: "0644"

    # ------------------------------------------------------------------
    # Base packages
    # ------------------------------------------------------------------
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
          - jq
          - openssl
          - apt-transport-https
          - software-properties-common
          - gdebi-core
          - python3-dbus
          - python3-gi
          - python3-apt
          - make
        state: present
        update_cache: true

    # ------------------------------------------------------------------
    # Docker + NVIDIA container toolkit (for bibr's Compose stack)
    # ------------------------------------------------------------------
    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker apt key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu jammy stable"
        filename: docker
        state: present

    - name: Add NVIDIA container toolkit apt key
      ansible.builtin.shell: curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --dearmor -o /etc/apt/keyrings/nvidia-container-toolkit.gpg
      args:
        creates: /etc/apt/keyrings/nvidia-container-toolkit.gpg

    - name: Add NVIDIA container toolkit apt repository
      ansible.builtin.shell: >
        curl -fsSL https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list
        | sed 's#deb https://#deb [signed-by=/etc/apt/keyrings/nvidia-container-toolkit.gpg] https://#g'
        > /etc/apt/sources.list.d/nvidia-container-toolkit.list
      args:
        creates: /etc/apt/sources.list.d/nvidia-container-toolkit.list

    - name: Install Docker and the NVIDIA container toolkit
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
          - nvidia-container-toolkit
        state: present
        update_cache: true
      register: docker_pkgs

    - name: Register the NVIDIA runtime with Docker
      ansible.builtin.command: nvidia-ctk runtime configure --runtime=docker
      args:
        creates: /etc/docker/daemon.json
      register: nvidia_runtime

    - name: Find a large disk for Docker's images
      ansible.builtin.shell: |
        set -e
        if [ "{{ metacheck_docker_root }}" != "auto" ]; then
          echo "{{ metacheck_docker_root }}"; exit 0
        fi
        # First mounted SRC storage volume under /data (persistent across restarts).
        vol=$(findmnt -rn -o TARGET | grep '^/data/' | head -1 || true)
        if [ -n "$vol" ]; then echo "$vol/metacheck-docker"; exit 0; fi
        # Ephemeral scratch disk (images are rebuilt after a reboot).
        if findmnt -rn /mnt/scratch >/dev/null; then echo "/mnt/scratch/metacheck-docker"; exit 0; fi
        echo "/var/lib/docker"
      register: docker_root_probe
      changed_when: false

    - name: Set Docker data directory
      ansible.builtin.set_fact:
        docker_data_root: "{{ docker_root_probe.stdout | trim }}"

    - name: Check free space where Docker will build (needs about 90 GB)
      ansible.builtin.shell: df -BG --output=avail "$(dirname {{ docker_data_root }})" | tail -1 | tr -dc '0-9'
      register: docker_root_free
      changed_when: false
      failed_when: (docker_root_free.stdout | int) < 90

    - name: Show Docker data directory
      ansible.builtin.debug:
        msg: "Docker images go to {{ docker_data_root }} ({{ docker_root_free.stdout }} GB free)"

    - name: Point Docker at that directory
      ansible.builtin.shell: |
        set -e
        tmp=$(mktemp)
        # Docker 29 keeps images in the containerd store under /var/lib/containerd,
        # which ignores data-root; the classic store keeps everything under data-root.
        jq --arg root "{{ docker_data_root }}" '. + {"data-root": $root, "features": {"containerd-snapshotter": false}}' /etc/docker/daemon.json > "$tmp"
        if ! cmp -s "$tmp" /etc/docker/daemon.json; then mv "$tmp" /etc/docker/daemon.json; echo changed; else rm -f "$tmp"; fi
      register: daemon_json
      changed_when: "'changed' in daemon_json.stdout"

    - name: Create Docker's systemd drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/docker.service.d
        state: directory
        mode: "0755"

    - name: Make Docker wait for that disk at boot
      ansible.builtin.copy:
        dest: /etc/systemd/system/docker.service.d/metacheck-data-root.conf
        mode: "0644"
        content: |
          [Unit]
          RequiresMountsFor={{ docker_data_root }}
      register: docker_dropin
      when: docker_data_root != '/var/lib/docker'

    - name: Enable and restart Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: "{{ 'restarted' if (docker_pkgs.changed or nvidia_runtime.changed or daemon_json.changed or docker_dropin.changed) else 'started' }}"
        daemon_reload: true

    # ------------------------------------------------------------------
    # Ollama (local language model on the GPU)
    # ------------------------------------------------------------------
    - name: Install Ollama
      ansible.builtin.shell: curl -fsSL https://ollama.com/install.sh | sh
      args:
        creates: /usr/local/bin/ollama
      register: ollama_install
      when: metacheck_llm_provider == 'ollama'

    - name: Create the Ollama model directory on the large disk
      ansible.builtin.file:
        path: "{{ docker_data_root | dirname }}/metacheck-ollama"
        state: directory
        owner: ollama
        group: ollama
        mode: "0755"
      when: metacheck_llm_provider == 'ollama'

    - name: Create the Ollama systemd drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/ollama.service.d
        state: directory
        mode: "0755"
      when: metacheck_llm_provider == 'ollama'

    - name: Configure Ollama (reachable from containers, model kept loaded, models on the large disk)
      ansible.builtin.copy:
        dest: /etc/systemd/system/ollama.service.d/metacheck.conf
        mode: "0644"
        content: |
          [Unit]
          RequiresMountsFor={{ docker_data_root | dirname }}/metacheck-ollama
          [Service]
          # Listen on all interfaces so the bibr container can reach it through
          # host.docker.internal; the SRC firewall keeps port 11434 closed outside.
          Environment=OLLAMA_HOST=0.0.0.0:11434
          Environment=OLLAMA_MODELS={{ docker_data_root | dirname }}/metacheck-ollama
          Environment=OLLAMA_KEEP_ALIVE=-1
          Environment=OLLAMA_MAX_LOADED_MODELS=1
      register: ollama_conf
      when: metacheck_llm_provider == 'ollama'

    - name: Enable and restart Ollama
      ansible.builtin.systemd:
        name: ollama
        enabled: true
        state: "{{ 'restarted' if (ollama_install.changed or ollama_conf.changed) else 'started' }}"
        daemon_reload: true
      when: metacheck_llm_provider == 'ollama'

    # ------------------------------------------------------------------
    # bibr Compose stack (built and started in the background)
    # ------------------------------------------------------------------
    - name: Clone bibr at the pinned release
      ansible.builtin.git:
        repo: https://github.com/scienceverse/bibr.git
        dest: "{{ metacheck_bibr_dir }}"
        version: "{{ metacheck_bibr_ref }}"
        depth: 1
        force: true
      register: bibr_git

    - name: Flag a rebuild of the bibr images when the bibr source changed
      ansible.builtin.file:
        path: "{{ metacheck_bibr_dir }}/.rebuild"
        state: touch
        mode: "0644"
      when: bibr_git.changed

    - name: Write bibr environment file
      ansible.builtin.template:
        src: templates/bibr.env.j2
        dest: "{{ metacheck_bibr_dir }}/.env"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      register: bibr_env

    - name: Let the bibr container reach services on the workspace (Ollama)
      ansible.builtin.copy:
        src: files/docker-compose.override.yml
        dest: "{{ metacheck_bibr_dir }}/docker-compose.override.yml"
        owner: root
        group: root
        mode: "0644"

    - name: Install bibr stack start script
      ansible.builtin.copy:
        src: files/bibr-stack-up.sh
        dest: "{{ metacheck_root }}/bin/bibr-stack-up.sh"
        owner: root
        group: root
        mode: "0755"

    - name: Install bibr stack systemd service
      ansible.builtin.template:
        src: templates/bibr-stack.service.j2
        dest: /etc/systemd/system/bibr-stack.service
        owner: root
        group: root
        mode: "0644"

    - name: Start the bibr stack build in the background
      ansible.builtin.systemd:
        name: bibr-stack
        enabled: true
        # A changed .env must reach the running containers: restart re-runs the
        # script, which only rebuilds what changed and recreates the containers.
        state: "{{ 'restarted' if bibr_env.changed else 'started' }}"
        daemon_reload: true
        no_block: true
      when: metacheck_start_bibr | bool

    # ------------------------------------------------------------------
    # R (CRAN apt repository + r2u binary packages)
    # ------------------------------------------------------------------
    - name: Update status file
      ansible.builtin.lineinfile:
        path: /var/log/metacheck/status.txt
        line: "{{ lookup('pipe', 'date \"+%Y-%m-%d %H:%M:%S\"') }}  component: bibr build started in background; installing R"

    - name: Add r2u apt key
      ansible.builtin.get_url:
        url: https://eddelbuettel.github.io/r2u/assets/dirk_eddelbuettel_key.asc
        dest: /etc/apt/trusted.gpg.d/cranapt_key.asc
        mode: "0644"

    - name: Add CRAN Ubuntu apt key
      ansible.builtin.get_url:
        url: https://cloud.r-project.org/bin/linux/ubuntu/marutter_pubkey.asc
        dest: /etc/apt/trusted.gpg.d/cran_ubuntu_key.asc
        mode: "0644"

    - name: Add r2u apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://r2u.stat.illinois.edu/ubuntu jammy main"
        filename: cranapt
        state: present

    - name: Add CRAN R apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://cloud.r-project.org/bin/linux/ubuntu jammy-cran40/"
        filename: cran_r
        state: present

    - name: Pin r2u packages above Ubuntu's own R packages
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/99cranapt
        mode: "0644"
        content: |
          Package: *
          Pin: release o=CRAN-Apt Project
          Pin: release l=CRAN-Apt Packages
          Pin-Priority: 700

    - name: Install R
      ansible.builtin.apt:
        name:
          - r-base-core
          - r-base-dev
        state: present
        update_cache: true

    - name: Install bspm (lets install.packages use r2u binaries)
      ansible.builtin.apt:
        name: r-cran-bspm
        state: present

    - name: Enable bspm for every R session
      ansible.builtin.blockinfile:
        path: /usr/lib/R/etc/Rprofile.site
        create: true
        mode: "0644"
        marker: "# {mark} metacheck component: r2u"
        block: |
          # Binary installs through apt only work for root; other users
          # (for example the shiny service user) would only get a D-Bus warning.
          if (identical(Sys.info()[["user"]], "root")) suppressMessages(bspm::enable())
          options(bspm.version.check = FALSE)

    - name: Install CRAN packages as Ubuntu binaries
      ansible.builtin.apt:
        name: "{{ r_packages }}"
        state: present

    - name: Install Quarto
      ansible.builtin.apt:
        deb: "https://github.com/quarto-dev/quarto-cli/releases/download/v{{ quarto_version }}/quarto-{{ quarto_version }}-linux-amd64.deb"
        state: present

    - name: Install Shiny Server
      ansible.builtin.apt:
        deb: "{{ shiny_server_deb }}"
        state: present

    # ------------------------------------------------------------------
    # metacheck package and the paper report app
    # ------------------------------------------------------------------
      register: shiny_pkg

    - name: Update status file
      ansible.builtin.lineinfile:
        path: /var/log/metacheck/status.txt
        line: "{{ lookup('pipe', 'date \"+%Y-%m-%d %H:%M:%S\"') }}  component: installing metacheck"

    - name: Copy metacheck install script
      ansible.builtin.copy:
        src: files/install-metacheck.R
        dest: "{{ metacheck_root }}/bin/install-metacheck.R"
        mode: "0644"

    - name: Install metacheck from GitHub
      ansible.builtin.command: Rscript {{ metacheck_root }}/bin/install-metacheck.R {{ metacheck_metacheck_repo }} {{ metacheck_metacheck_ref }}
      register: metacheck_install
      # remotes skips the install when the GitHub commit is already installed
      changed_when: "'Skipping install' not in (metacheck_install.stdout + metacheck_install.stderr)"

    - name: Show the installed metacheck
      ansible.builtin.debug:
        msg: "{{ metacheck_install.stdout_lines | last }}"

    - name: Create the app directory
      ansible.builtin.file:
        path: /srv/shiny-server/metacheck
        state: directory
        owner: shiny
        group: shiny
        mode: "0755"

    # The component's own edition of metacheck's paper report app (app/ in this
    # repository; see the header of app/app.R for what differs and why).
    - name: Install the paper report app
      ansible.builtin.copy:
        src: app/
        dest: /srv/shiny-server/metacheck/
        owner: shiny
        group: shiny
        mode: u=rwX,g=rX,o=rX
      register: shiny_app_copy

    - name: Remove Shiny Server's sample apps and index page
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /srv/shiny-server/sample-apps
        - /srv/shiny-server/index.html

    - name: Write Shiny Server configuration
      ansible.builtin.copy:
        src: files/shiny-server.conf
        dest: /etc/shiny-server/shiny-server.conf
        owner: root
        group: root
        mode: "0644"
      register: shiny_conf

    - name: Write environment for the shiny user (bibr token, LLM keys)
      ansible.builtin.template:
        src: templates/Renviron.j2
        dest: /home/shiny/.Renviron
        owner: shiny
        group: shiny
        mode: "0600"
      no_log: true
      register: shiny_env

    - name: Enable and restart Shiny Server
      ansible.builtin.systemd:
        name: shiny-server
        enabled: true
        state: "{{ 'restarted' if (shiny_pkg.changed or metacheck_install.changed or shiny_app_copy.changed or shiny_conf.changed or shiny_env.changed) else 'started' }}"

    # ------------------------------------------------------------------
    # nginx (only when the SRC-Nginx component configured the workspace)
    # ------------------------------------------------------------------
    - name: Check for the SRC-Nginx location directory
      ansible.builtin.stat:
        path: /etc/nginx/app-location-conf.d
      register: nginx_locations

    - name: Install nginx locations for metacheck and bibr
      ansible.builtin.template:
        src: templates/metacheck-nginx.conf.j2
        dest: /etc/nginx/app-location-conf.d/metacheck.conf
        owner: root
        group: root
        mode: "0644"
      when: nginx_locations.stat.exists

    - name: Reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
      when: nginx_locations.stat.exists

    - name: Note the absence of SRC-Nginx
      ansible.builtin.debug:
        msg: "SRC-Nginx is not installed: the app is only reachable on the workspace itself (http://127.0.0.1:{{ metacheck_shiny_port }}/metacheck/)."
      when: not nginx_locations.stat.exists

    # ------------------------------------------------------------------
    # Done
    # ------------------------------------------------------------------
    - name: Update status file
      ansible.builtin.lineinfile:
        path: /var/log/metacheck/status.txt
        line: "{{ lookup('pipe', 'date \"+%Y-%m-%d %H:%M:%S\"') }}  component: metacheck app installed; waiting for the bibr stack (see lines below)"

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "metacheck report app: /metacheck/ on the workspace URL (Shiny Server on 127.0.0.1:{{ metacheck_shiny_port }})"
          - "bibr API: /bibr/ on the workspace URL; bearer token in {{ metacheck_secrets_dir }}/bibr_api_key (root only)"
          - "bibr stack build progress: /metacheck-status on the workspace URL, or /var/log/metacheck/status.txt"
