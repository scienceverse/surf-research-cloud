---
# metacheck on SURF Research Cloud
#
# Installs on one workspace:
#   * R, Quarto, Shiny Server and metacheck (dev), with the component's own
#     edition of the paper report app (app/)
#   * optionally Ollama with a local model for the app's LLM power check
#     (only on a workspace with an NVIDIA GPU)
#   * nginx locations behind the SRAM login (only when SRC-Nginx is present)
#
# PDFs are converted by a bibr server: the one on this workspace when the bibr
# component ran first, or one on another workspace on the same SRC private
# network (metacheck_bibr_url + metacheck_bibr_api_key). Without bibr the app
# uses the GROBID servers it lists.
#
# SRC runs this as root on the workspace itself:
#   ansible-playbook --connection=local -i localhost, -b --extra-vars="<parameters>" metacheck.yml

- name: metacheck paper report app on a SURF Research Cloud workspace
  hosts: localhost
  gather_facts: false
  become: true

  vars:
    # ---- component parameters (strings; "none" = not set, "auto" = decide) ----
    metacheck_repo: "scienceverse/metacheck"
    # dev is where metacheck is developed; main lags months behind.
    metacheck_ref: "dev"
    # Modules to install from GitHub (metacheck::module_install(), metacheck
    # 0.4.0.1 or later), "owner/repo", separated by commas or spaces; "none" =
    # none. The web interface's repository check can run each on an uploaded
    # .zip (modules=<name>); nobody can install a module through it.
    metacheck_modules: "Lakens/tue_datamanager_check"
    # "auto" = the bibr on this workspace if the bibr component ran first,
    # else none; "none" = no bibr; or a bibr address on the SRC private
    # network, such as http://10.10.10.12:8000
    metacheck_bibr_url: "auto"
    # bibr's token; needed with an explicit metacheck_bibr_url
    metacheck_bibr_api_key: "none"
    # The GROBID server the web interface converts a PDF with when bibr
    # fails or there is none (metacheck's convert(), method "grobid"); the
    # report says which one converted it. "none" = no fallback.
    metacheck_grobid_url: "https://grobid.hti.ieis.tue.nl"
    # The language model for the LLM power check:
    # "ollama" = a local model when this workspace has a GPU, otherwise the
    #   model of the bibr workspace on the private network (bibr.yml,
    #   bibr_share_llm), so this workspace needs no GPU;
    # "bibr" = always the bibr workspace's model; "url" = the model of
    #   another OpenAI-compatible server (vLLM, Ollama, a gateway such as
    #   TU/e's SPIKE-1) at metacheck_llm_url; "none" = no model (the app's
    #   cloud providers below are still possible).
    # metacheck_llm_model must be the model that workspace or server serves.
    metacheck_llm: "ollama"
    metacheck_llm_model: "qwen3.5:4b"
    metacheck_ollama_context: "16384"
    # With metacheck_llm = url: the server's address (with or without /v1),
    # its key ("none" = no key), and the name the app shows for it ("none" =
    # the address's host name). The app, the web interface and the installed
    # modules (such as tue_datamanager_check) send text to this server as to
    # a model of their own, so name only a server you trust with uploads.
    metacheck_llm_url: "none"
    metacheck_llm_api_key: "none"
    metacheck_llm_name: "none"
    # The longest answer, in tokens, the server's model may give; "none" =
    # metacheck's default. A model that reasons before it answers needs more,
    # such as 16000 for DeepSeek on SPIKE-1.
    metacheck_llm_max_tokens: "none"
    metacheck_mistral_api_key: "none"
    metacheck_groq_api_key: "none"
    metacheck_max_upload: "100M"
    # "true" = the app is open to anyone, without the SRAM login; "false" =
    # SRAM login. Can be changed later with `sudo metacheck-public on|off`.
    metacheck_public: "false"
    # "true" = install new versions of metacheck (metacheck_ref) and of the
    # modules (metacheck_modules) from GitHub by itself: a timer looks every
    # 15 minutes and installs when no job is running
    # (files/metacheck/metacheck-auto-update); "false" = only when the
    # playbook runs.
    metacheck_auto_update: "true"
    # PsyArXiv reports (prototype): every hour, a checklist report for each of
    # this many newest PsyArXiv preprints that has none yet, shown at
    # /psyarxiv-reports/?id=<id> with a "report a mistake" button; "0" = off.
    # See api/psyarxiv_reports.R.
    metacheck_psyarxiv_reports: "10"
    # How many web interface jobs run at a time, each in its own R process;
    # the others wait in the queue.
    metacheck_api_workers: "2"
    # The most processors and memory (such as 16G or 8000M) one job's code
    # may use in the sandbox. "auto" = 4 processors and 16G, less on a small
    # workspace: never more processors than it has, and at most its memory
    # minus 4G, shared among metacheck_api_workers jobs.
    metacheck_sandbox_cpus: "auto"
    metacheck_sandbox_memory: "auto"
    # Where "report a mistake" messages are mailed (with the report and a
    # delete button), and how: an SMTP server address such as
    # smtps://smtp.gmail.com:465, with its user name and password. "none" =
    # messages are only saved (<reports folder>/feedback/).
    metacheck_mail_to: "none"
    metacheck_mail_from: "none"
    metacheck_smtp_url: "none"
    metacheck_smtp_user: "none"
    metacheck_smtp_password: "none"

    # ---- fixed settings ----
    component_label: "metacheck component"
    # Run the R and Python code of uploaded repositories (metacheck's
    # reproducibility check) in a locked-down Docker sandbox (tasks/sandbox.yml).
    # Skipped when bibr runs on the same workspace (its containers need other
    # Docker settings).
    metacheck_run_code: "true"
    metacheck_sandbox_size: "60G"
    metacheck_sandbox_images:
      - ghcr.io/scienceverse/metacheck_r_large:latest
      - ghcr.io/scienceverse/metacheck_py_large:latest

    metacheck_shiny_port: 3838
    metacheck_api_port: 2005
    metacheck_component_dir: /opt/metacheck-component
    # installed modules (METACHECK_MODULES_DIR), readable by the shiny user
    metacheck_modules_dir: /opt/metacheck-component/modules
    metacheck_log_dir: /var/log/metacheck
    status_dir: /var/log/metacheck
    status_file: /var/log/metacheck/status.txt
    bibr_local_key_file: /etc/bibr/api_key
    shiny_server_deb: https://download3.rstudio.org/ubuntu-20.04/x86_64/shiny-server-1.5.23.1030-amd64.deb
    quarto_version: "1.10.19"
    r_packages:
      - r-cran-remotes
      - r-cran-shiny
      - r-cran-shinydashboard
      - r-cran-shinyjs
      - r-cran-dt
      - r-cran-dplyr
      - r-cran-tidyr
      - r-cran-readr
      - r-cran-knitr
      - r-cran-rmarkdown
      - r-cran-quarto
      - r-cran-bibtex
      - r-cran-ellmer
      - r-cran-jsonlite
      - r-cran-xml2
      - r-cran-curl
      - r-cran-httr2
      - r-cran-rvest
      - r-cran-rappdirs
      - r-cran-tidytext
      - r-cran-statcheck
      - r-cran-base64enc
      - r-cran-gitcreds
      - r-cran-roxygen2
      - r-cran-jpeg
      - r-cran-progress
      - r-cran-ggplot2
      # the paper report app runs each report in its own R process
      - r-cran-callr
      - r-cran-processx
      # optional packages that metacheck's data and codebook checks use
      - r-cran-careless
      - r-cran-readods
      - r-cran-openxlsx
      - r-cran-haven
      - r-cran-readxl
      - r-cran-data.table
      - r-cran-officer
      - r-cran-pdftools
      - r-cran-snowballc
      - r-cran-yaml
      - r-cran-dbi
      - r-cran-rsqlite
      - r-cran-zip
      - r-cran-digest
      # the web interface (api/): plumber and what metacheck's API helpers use
      - r-cran-plumber
      - r-cran-logger
      - r-cran-uuid
      - r-cran-mime
      - r-cran-webutils
      - r-cran-swagger


  tasks:
    - name: Shared first steps
      ansible.builtin.include_tasks: tasks/base.yml

    - name: Create the component directory
      ansible.builtin.file:
        path: "{{ metacheck_component_dir }}/bin"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # ------------------------------------------------------------------
    # Which bibr to use
    # ------------------------------------------------------------------
    - name: Look for a bibr on this workspace
      ansible.builtin.stat:
        path: "{{ bibr_local_key_file }}"
      register: bibr_local_key

    - name: Read the local bibr token
      ansible.builtin.slurp:
        src: "{{ bibr_local_key_file }}"
      register: bibr_local_key_content
      when: metacheck_bibr_url == 'auto' and bibr_local_key.stat.exists
      no_log: true

    # An easy mistake in the portal, where the token's row comes first.
    - name: Check that the bibr address and token are not swapped
      ansible.builtin.assert:
        that:
          - not (metacheck_bibr_api_key is regex('^https?://') and metacheck_bibr_url is not regex('^https?://'))
        fail_msg: >-
          The bibr address and token are swapped: metacheck_bibr_url must be the
          address (such as http://10.10.10.12:8000) and metacheck_bibr_api_key the
          token. Correct them in the catalog item's parameters.
        quiet: true

    - name: Check the bibr settings
      ansible.builtin.assert:
        that:
          - metacheck_bibr_url in ['auto', 'none'] or metacheck_bibr_url is regex('^https?://')
          - metacheck_bibr_url in ['auto', 'none'] or metacheck_bibr_api_key != 'none'
          - metacheck_grobid_url == 'none' or metacheck_grobid_url is regex('^https?://')
        fail_msg: >-
          metacheck_bibr_url must be auto, none, or an address such as
          http://10.10.10.12:8000, and an address needs metacheck_bibr_api_key
          (on the bibr workspace: sudo cat /etc/bibr/api_key);
          metacheck_grobid_url must be none or an address such as
          https://grobid.hti.ieis.tue.nl.

    # A warning, not an error, as for bibr.
    - name: Check that the GROBID fallback answers
      ansible.builtin.uri:
        url: "{{ metacheck_grobid_url | trim | regex_replace('/+$', '') }}/api/isalive"
        timeout: 15
        return_content: true
      register: grobid_alive
      failed_when: false
      when: metacheck_grobid_url != 'none'

    - name: Report the GROBID fallback
      ansible.builtin.debug:
        msg: >-
          {{ 'No GROBID fallback: a PDF that bibr cannot convert is not checked.' if metacheck_grobid_url == 'none'
             else ('GROBID fallback at ' ~ metacheck_grobid_url ~ ': '
                   ~ ('it answers.' if (grobid_alive.status | default(0)) == 200 and 'true' in (grobid_alive.content | default(''))
                      else 'it does not answer now (HTTP ' ~ (grobid_alive.status | default('none')) ~ '); PDFs fail when bibr fails too.')) }}

    - name: Decide which bibr the app uses
      ansible.builtin.set_fact:
        metacheck_bibr_url_value: "{{ (('http://127.0.0.1:8000' if bibr_local_key.stat.exists else '') if metacheck_bibr_url == 'auto' else ('' if metacheck_bibr_url == 'none' else metacheck_bibr_url)) | trim | regex_replace('/+$', '') }}"
        metacheck_bibr_key_value: "{{ (((bibr_local_key_content.content | b64decode) if bibr_local_key.stat.exists else '') if metacheck_bibr_url == 'auto' else ('' if metacheck_bibr_url == 'none' else metacheck_bibr_api_key)) | trim }}"
        metacheck_bibr_remote: "{{ metacheck_bibr_url not in ['auto', 'none'] }}"
      no_log: true

    - name: Check that bibr answers (it may still be starting)
      ansible.builtin.uri:
        url: "{{ metacheck_bibr_url_value }}/ready"
        timeout: 10
      register: bibr_ready
      failed_when: false
      when: metacheck_bibr_url_value | length > 0

    - name: Report the bibr connection
      ansible.builtin.debug:
        msg: >-
          {{ 'No bibr: the app offers the GROBID servers only.' if metacheck_bibr_url_value | length == 0
             else ('bibr at ' ~ metacheck_bibr_url_value ~ ': '
                   ~ ('ready' if (bibr_ready.status | default(0)) == 200
                      else 'not answering yet (status ' ~ (bibr_ready.status | default('none')) ~ '); the app shows a warning until it does')) }}

    # ------------------------------------------------------------------
    # Local language model (Ollama), only with a GPU
    # ------------------------------------------------------------------
    - name: Check the model settings
      ansible.builtin.assert:
        that:
          - metacheck_llm in ['ollama', 'bibr', 'url', 'none']
          - metacheck_llm != 'url' or metacheck_llm_url is regex('^https?://[^/]+')
          - metacheck_llm_max_tokens == 'none' or metacheck_llm_max_tokens is regex('^[1-9][0-9]*$')
        fail_msg: >-
          metacheck_llm must be ollama, bibr, url or none; with url,
          metacheck_llm_url must be an address such as
          https://spike-gateway-runai-aiteam.inference.spike.tue.nl/v1; and
          metacheck_llm_max_tokens must be none or a whole number.

    - name: Decide on the local model
      ansible.builtin.set_fact:
        metacheck_local_llm: "{{ metacheck_llm == 'ollama' and (has_gpu | bool) }}"
        # another server's model (metacheck_llm = url): its address without
        # /v1, which the app and the web interface add themselves
        metacheck_url_llm: "{{ metacheck_llm == 'url' }}"
        metacheck_url_llm_base: "{{ metacheck_llm_url | trim | regex_replace('/+$', '') | regex_replace('/v1$', '') }}"
        # the bibr workspace's model, through its private network address
        metacheck_shared_llm: >-
          {{ (metacheck_llm == 'bibr' or (metacheck_llm == 'ollama' and not (has_gpu | bool)))
             and (metacheck_bibr_remote | bool) and metacheck_bibr_url_value | length > 0 }}
        metacheck_shared_llm_url: "{{ metacheck_bibr_url_value | regex_replace(':[0-9]+$', '') }}:11435"

    - name: Check that the bibr workspace shares its model
      ansible.builtin.uri:
        url: "{{ metacheck_shared_llm_url }}/v1/models"
        headers:
          Authorization: "Bearer {{ metacheck_bibr_key_value }}"
        timeout: 15
      register: shared_llm_probe
      failed_when: false
      no_log: true
      when: metacheck_shared_llm | bool

    - name: Name the other server's model
      ansible.builtin.set_fact:
        metacheck_llm_name_value: "{{ metacheck_llm_name if metacheck_llm_name != 'none' else (metacheck_url_llm_base | urlsplit('hostname')) }}"
      when: metacheck_url_llm | bool

    # A warning, not an error: the server may be down for a while, and the
    # power check then reports that the model did not answer.
    - name: Check that the other server's model answers
      ansible.builtin.uri:
        url: "{{ metacheck_url_llm_base }}/v1/models"
        headers: "{{ {'Authorization': 'Bearer ' ~ metacheck_llm_api_key} if metacheck_llm_api_key != 'none' else {} }}"
        timeout: 20
      register: url_llm_probe
      failed_when: false
      no_log: true
      when: metacheck_url_llm | bool

    - name: Note which model the power check uses
      ansible.builtin.debug:
        msg: >-
          {{ ('The power check uses the model of the bibr workspace at ' ~ metacheck_shared_llm_url ~
              (' (it answers).' if (shared_llm_probe.status | default(0)) == 200
               else ' but it does not answer yet (HTTP ' ~ (shared_llm_probe.status | default('none')) ~ '): run the bibr playbook with bibr_share_llm = true.'))
             if metacheck_shared_llm | bool else
             (('The power check uses ' ~ metacheck_llm_model ~ ' on ' ~ metacheck_llm_name_value ~ ' (' ~ metacheck_url_llm_base ~ ')' ~
               ((', which answers' ~ ('' if metacheck_llm_model in (url_llm_probe.json.data | default([]) | map(attribute='id') | list)
                                     else ', but does not list that model; check metacheck_llm_model') ~ '.')
                if (url_llm_probe.status | default(0)) == 200
                else (', but it does not answer (' ~ ('HTTP ' ~ url_llm_probe.status if (url_llm_probe.status | default(-1)) > 0
                                                        else 'no connection: ' ~ (url_llm_probe.msg | default('') | truncate(120))) ~
                      '): check the address, the key, and whether this workspace may reach that server.')))
              if metacheck_url_llm | bool else
              ('No model: ' ~ ('metacheck_llm is none' if metacheck_llm == 'none' else 'no GPU and no bibr workspace on the private network') ~
               '. The LLM power check in the app can still use a cloud provider.')) }}
      when: not (metacheck_local_llm | bool)

    # For model files, and for the web interface's job folders (uploads of up
    # to 500 MB, unpacked to up to 1000 MB).
    - name: Find a large disk for model files and jobs
      ansible.builtin.include_tasks: tasks/large_disk.yml

    # Anonymous use counts of the app and the web interface (metacheck's
    # METACHECK_USAGE_DIR), on the storage volume when there is one, so they
    # outlive the workspace.
    - name: Choose the folder for use counts
      ansible.builtin.set_fact:
        metacheck_usage_dir: "{{ (large_disk ~ '/metacheck-usage') if large_disk is match('/data/') else '/var/lib/metacheck-usage' }}"

    - name: Install Ollama and pull the model
      ansible.builtin.include_tasks: tasks/ollama.yml
      vars:
        ollama_model: "{{ metacheck_llm_model }}"
        ollama_context_length: "{{ metacheck_ollama_context }}"
      when: metacheck_local_llm | bool

    # ------------------------------------------------------------------
    # R, Quarto, Shiny Server, metacheck and the paper report app
    # ------------------------------------------------------------------
    - name: Install packages R needs to build metacheck
      ansible.builtin.apt:
        name:
          - gdebi-core
          - python3-dbus
          - python3-gi
          - python3-apt
          - make
        state: present

    - name: Add r2u apt key
      ansible.builtin.get_url:
        url: https://eddelbuettel.github.io/r2u/assets/dirk_eddelbuettel_key.asc
        dest: /etc/apt/trusted.gpg.d/cranapt_key.asc
        mode: "0644"

    - name: Add CRAN Ubuntu apt key
      ansible.builtin.get_url:
        url: https://cloud.r-project.org/bin/linux/ubuntu/marutter_pubkey.asc
        dest: /etc/apt/trusted.gpg.d/cran_ubuntu_key.asc
        mode: "0644"

    - name: Add r2u apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://r2u.stat.illinois.edu/ubuntu jammy main"
        filename: cranapt
        state: present

    - name: Add CRAN R apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://cloud.r-project.org/bin/linux/ubuntu jammy-cran40/"
        filename: cran_r
        state: present

    - name: Pin r2u packages above Ubuntu's own R packages
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/99cranapt
        mode: "0644"
        content: |
          Package: *
          Pin: release o=CRAN-Apt Project
          Pin: release l=CRAN-Apt Packages
          Pin-Priority: 700

    - name: Install R
      ansible.builtin.apt:
        name:
          - r-base-core
          - r-base-dev
        state: present
        update_cache: true

    - name: Install bspm (lets install.packages use r2u binaries)
      ansible.builtin.apt:
        name: r-cran-bspm
        state: present

    - name: Enable bspm for every R session
      ansible.builtin.blockinfile:
        path: /usr/lib/R/etc/Rprofile.site
        create: true
        mode: "0644"
        marker: "# {mark} metacheck component: r2u"
        block: |
          # Binary installs through apt only work for root; other users
          # (for example the shiny service user) would only get a D-Bus warning.
          if (identical(Sys.info()[["user"]], "root")) suppressMessages(bspm::enable())
          options(bspm.version.check = FALSE)

    - name: Install CRAN packages as Ubuntu binaries
      ansible.builtin.apt:
        name: "{{ r_packages }}"
        state: present

    - name: Install Quarto
      ansible.builtin.apt:
        deb: "https://github.com/quarto-dev/quarto-cli/releases/download/v{{ quarto_version }}/quarto-{{ quarto_version }}-linux-amd64.deb"
        state: present
    - name: Install Shiny Server
      ansible.builtin.apt:
        deb: "{{ shiny_server_deb }}"
        state: present

    # ------------------------------------------------------------------
    # metacheck package and the paper report app
    # ------------------------------------------------------------------
      register: shiny_pkg

    # The automatic update (files/metacheck/metacheck-auto-update) also
    # installs metacheck and the modules, and stops the web interface while
    # it does; both at once broke an install on 22 October 2026. It holds
    # /run/metacheck-auto-update.lock while it runs and skips a turn when the
    # lock is taken. So a helper takes that lock (after a running update has
    # finished) and keeps it until the end of this run; when a run stops
    # early, the helper lets go after an hour.
    - name: Hold off automatic updates while this playbook runs
      ansible.builtin.shell: |
        systemctl stop metacheck-playbook-hold 2>/dev/null || true
        rm -f /run/metacheck-playbook-hold.ok
        systemd-run --unit=metacheck-playbook-hold --collect \
          flock -w 1800 /run/metacheck-auto-update.lock \
          sh -c "touch /run/metacheck-playbook-hold.ok; exec sleep 3600"
      changed_when: false

    - name: Wait until no automatic update is running (at most 30 minutes)
      ansible.builtin.wait_for:
        path: /run/metacheck-playbook-hold.ok
        timeout: 1800

    - name: Copy metacheck install script
      ansible.builtin.copy:
        src: files/metacheck/install-metacheck.R
        dest: "{{ metacheck_component_dir }}/bin/install-metacheck.R"
        mode: "0644"

    - name: Install metacheck from GitHub
      ansible.builtin.command: Rscript {{ metacheck_component_dir }}/bin/install-metacheck.R {{ metacheck_repo }} {{ metacheck_ref }}
      register: metacheck_install
      # remotes skips the install when the GitHub commit is already installed
      changed_when: "'Skipping install' not in (metacheck_install.stdout + metacheck_install.stderr)"

    - name: Show the installed metacheck
      ansible.builtin.debug:
        msg: "{{ metacheck_install.stdout_lines | last }}"

    - name: Create the folder for installed metacheck modules
      ansible.builtin.file:
        path: "{{ metacheck_modules_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy the module install script
      ansible.builtin.copy:
        src: files/metacheck/install-modules.R
        dest: "{{ metacheck_component_dir }}/bin/install-modules.R"
        mode: "0644"

    - name: Install metacheck modules from GitHub (metacheck_modules)
      ansible.builtin.command:
        argv: "{{ ['Rscript', metacheck_component_dir ~ '/bin/install-modules.R'] + (metacheck_modules | regex_replace(',', ' ')).split() }}"
      environment:
        METACHECK_MODULES_DIR: "{{ metacheck_modules_dir }}"
      register: metacheck_modules_install
      # module_install() and module_update() say "Installed ..." when they
      # downloaded a commit, "... is already up to date" otherwise
      changed_when: "'Installed ' in metacheck_modules_install.stderr"
      when: metacheck_modules not in ['', 'none']

    - name: Show the installed modules
      ansible.builtin.debug:
        msg: "{{ (metacheck_modules_install.stderr_lines | select('match', '^NOT INSTALLED') | list) + [metacheck_modules_install.stdout_lines | last] }}"
      when: metacheck_modules not in ['', 'none']

    - name: Create the app directory
      ansible.builtin.file:
        path: /srv/shiny-server/metacheck
        state: directory
        owner: shiny
        group: shiny
        mode: "0755"

    # The component's own edition of metacheck's paper report app (app/ in this
    # repository; see the header of app/app.R for what differs and why).
    - name: Install the paper report app
      ansible.builtin.copy:
        src: app/
        dest: /srv/shiny-server/metacheck/
        owner: shiny
        group: shiny
        mode: u=rwX,g=rX,o=rX
      register: shiny_app_copy

    - name: Remove Shiny Server's sample apps and index page
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /srv/shiny-server/sample-apps
        - /srv/shiny-server/index.html

    - name: Write Shiny Server configuration
      ansible.builtin.copy:
        src: files/metacheck/shiny-server.conf
        dest: /etc/shiny-server/shiny-server.conf
        owner: root
        group: root
        mode: "0644"
      register: shiny_conf

    - name: Create the folder for use counts
      ansible.builtin.file:
        path: "{{ metacheck_usage_dir }}"
        state: directory
        owner: shiny
        group: shiny
        mode: "0700"

    # A reused volume may hold the counts of an earlier workspace, whose shiny
    # user had another number.
    - name: Give the shiny user the counts already in that folder
      ansible.builtin.file:
        path: "{{ metacheck_usage_dir }}"
        state: directory
        owner: shiny
        group: shiny
        recurse: true

    # PsyArXiv reports (prototype, api/psyarxiv_reports.R): reports/ is read
    # by nginx (/psyarxiv-reports-files/), feedback/ and deleted/ only by the
    # shiny user; on the storage volume when there is one.
    - name: Choose the folder for PsyArXiv reports
      ansible.builtin.set_fact:
        metacheck_psyarxiv_reports_dir: "{{ (large_disk ~ '/psyarxiv-reports') if large_disk is match('/data/') else '/var/lib/metacheck-psyarxiv-reports' }}"

    - name: Create the PsyArXiv reports folders
      ansible.builtin.file:
        path: "{{ metacheck_psyarxiv_reports_dir }}/{{ item.sub }}"
        state: directory
        owner: shiny
        group: shiny
        mode: "{{ item.mode }}"
      loop:
        - { sub: "", mode: "0755" }
        - { sub: reports, mode: "0755" }
        - { sub: feedback, mode: "0700" }
        - { sub: deleted, mode: "0700" }

    - name: Make the key for PsyArXiv report delete links (once, kept on the workspace)
      ansible.builtin.shell: |
        f={{ metacheck_component_dir }}/psyarxiv-reports.secret
        mkdir -p {{ metacheck_component_dir }}
        [ -s "$f" ] || (umask 077; openssl rand -hex 32 > "$f")
        cat "$f"
      register: psyarxiv_reports_secret
      changed_when: false
      no_log: true

    - name: Write environment for the shiny user (bibr token, LLM keys)
      ansible.builtin.template:
        src: templates/metacheck/Renviron.j2
        dest: /home/shiny/.Renviron
        owner: shiny
        group: shiny
        mode: "0600"
      no_log: true
      register: shiny_env

    - name: Enable and restart Shiny Server
      ansible.builtin.systemd:
        name: shiny-server
        enabled: true
        state: "{{ 'restarted' if (shiny_pkg.changed or metacheck_install.changed or shiny_app_copy.changed or shiny_conf.changed or shiny_env.changed) else 'started' }}"

    # ------------------------------------------------------------------
    # Sandbox for running the code of uploaded repositories
    # ------------------------------------------------------------------
    - name: Check whether bibr runs on this workspace
      ansible.builtin.stat:
        path: /opt/bibr
      register: sandbox_bibr_here

    - name: Note that code will not be run
      ansible.builtin.debug:
        msg: "Code of uploaded repositories will not be run: {{ 'metacheck_run_code is false' if not (metacheck_run_code | bool) else 'bibr uses Docker on this workspace with other settings' }}."
      when: not (metacheck_run_code | bool) or sandbox_bibr_here.stat.exists

    - name: Check the job and sandbox settings
      ansible.builtin.assert:
        that:
          - metacheck_api_workers is regex('^[1-9][0-9]*$')
          - metacheck_sandbox_cpus == 'auto' or metacheck_sandbox_cpus is regex('^[0-9]+([.][0-9]+)?$')
          - metacheck_sandbox_memory == 'auto' or metacheck_sandbox_memory is regex('^[0-9]+[GgMm]$')
        fail_msg: >-
          metacheck_api_workers must be a whole number of at least 1,
          metacheck_sandbox_cpus auto or a number of processors (such as 2), and
          metacheck_sandbox_memory auto or an amount such as 8G or 6000M.

    - name: Read the workspace's processors and memory
      ansible.builtin.shell: echo "$(nproc) $(awk '/^MemTotal:/ {print int($2 / 1024)}' /proc/meminfo)"
      register: workspace_size
      changed_when: false
      check_mode: false

    # Docker refuses a container that asks for more processors than the
    # workspace has, so the processors are never more than that. "auto"
    # memory leaves 4G for the rest (web interface, app, jobs' R processes,
    # Docker), and is a multiple of 256M, at least 1G.
    - name: Decide what one job's code may use in the sandbox
      ansible.builtin.set_fact:
        metacheck_sandbox_cpus_value: "{{ [(4 if metacheck_sandbox_cpus == 'auto' else metacheck_sandbox_cpus | float), workspace_size.stdout.split()[0] | int] | min }}"
        metacheck_sandbox_memory_mb: >-
          {{ ([[16384, ((workspace_size.stdout.split()[1] | int) - 4096) // (metacheck_api_workers | int) // 256 * 256] | min, 1024] | max)
             if metacheck_sandbox_memory == 'auto'
             else ((metacheck_sandbox_memory[:-1] | int) * (1024 if metacheck_sandbox_memory[-1] in 'Gg' else 1)) }}

    - name: Note the sandbox limits
      ansible.builtin.debug:
        msg: >-
          Jobs at a time: {{ metacheck_api_workers }}. One job's code may use
          {{ metacheck_sandbox_cpus_value }} of {{ workspace_size.stdout.split()[0] }} processors and
          {{ metacheck_sandbox_memory_mb }} MB of {{ workspace_size.stdout.split()[1] }} MB memory.
      when: metacheck_run_code | bool

    - name: Set up the sandbox
      ansible.builtin.include_tasks: tasks/sandbox.yml
      when: metacheck_run_code | bool and not sandbox_bibr_here.stat.exists

    - name: Remember whether code can be run
      ansible.builtin.set_fact:
        metacheck_sandbox_on: "{{ (metacheck_run_code | bool) and not sandbox_bibr_here.stat.exists and (metacheck_sandbox_ready | default(false) | bool) }}"

    # ------------------------------------------------------------------
    # Web interface (api/): PDF or bibr JSON in, report out
    # ------------------------------------------------------------------
    - name: Create the web interface folder
      ansible.builtin.file:
        path: "{{ metacheck_component_dir }}/api/metacheck-plumber"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # metacheck's API helper code (inst/plumber/utils) and its repository
    # check app (inst/app/shiny_app_repocheck, for folder checks) are not part
    # of the installed package (.Rbuildignore), so they are taken from the
    # same repository and branch metacheck was installed from. The script is
    # shared with metacheck-auto-update.
    - name: Copy the script that fetches metacheck's API helper code
      ansible.builtin.copy:
        src: files/metacheck/fetch-api-helpers.sh
        dest: "{{ metacheck_component_dir }}/bin/fetch-api-helpers.sh"
        mode: "0755"

    - name: Fetch metacheck's API helper code and repository check app
      ansible.builtin.command:
        argv: ["{{ metacheck_component_dir }}/bin/fetch-api-helpers.sh", "{{ metacheck_repo }}", "{{ metacheck_ref }}", "{{ metacheck_component_dir }}"]
      register: api_helpers
      changed_when: "'changed' in api_helpers.stdout"

    - name: Install the command that summarises the use counts
      ansible.builtin.copy:
        src: files/metacheck/metacheck-usage
        dest: /usr/local/sbin/metacheck-usage
        owner: root
        group: root
        mode: "0755"

    - name: Install the web interface
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ metacheck_component_dir }}/api/{{ item.dest }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - { src: api/api.R, dest: api.R }
        - { src: api/worker.R, dest: worker.R }
        - { src: api/psyarxiv_reports.R, dest: psyarxiv_reports.R }
        - { src: api/psyarxiv-reports-generate.R, dest: psyarxiv-reports-generate.R }
        - { src: app/bibr_client.R, dest: bibr_client.R }
      register: api_files

    # The website: static files, served by nginx (location /site/).
    - name: Install the website
      ansible.builtin.copy:
        src: site/
        dest: "{{ metacheck_component_dir }}/site/"
        owner: root
        group: root
        mode: u=rwX,go=rX
        directory_mode: "0755"

    # Job folders (uploads while queued, results for one hour), shiny only;
    # on the storage volume when there is one. Recursive, because a reused
    # volume may hold folders of an earlier workspace's shiny user.
    - name: Choose the web interface's job folder
      ansible.builtin.set_fact:
        metacheck_api_jobs_dir: "{{ (large_disk ~ '/metacheck-api-jobs') if large_disk is match('/data/') else '/var/lib/metacheck-api/jobs' }}"

    - name: Create the web interface's job folder
      ansible.builtin.file:
        path: "{{ metacheck_api_jobs_dir }}"
        state: directory
        owner: shiny
        group: shiny
        mode: "0700"

    - name: Give the shiny user what is already in the job folder
      ansible.builtin.file:
        path: "{{ metacheck_api_jobs_dir }}"
        state: directory
        owner: shiny
        group: shiny
        recurse: true

    - name: Install the web interface service
      ansible.builtin.template:
        src: templates/metacheck/metacheck-api.service.j2
        dest: /etc/systemd/system/metacheck-api.service
        owner: root
        group: root
        mode: "0644"
      register: api_service

    - name: Enable and (re)start the web interface
      ansible.builtin.systemd:
        name: metacheck-api
        enabled: true
        daemon_reload: true
        state: "{{ 'restarted' if (api_helpers.changed or api_files.changed or api_service.changed or metacheck_install.changed or shiny_env.changed) else 'started' }}"

    - name: Wait for the web interface to answer
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ metacheck_api_port }}/health"
      register: api_up
      until: api_up.status == 200
      retries: 30
      delay: 2

    # PsyArXiv reports (prototype): psyarxiv-reports-generate.R every hour, as
    # the shiny user, through the web interface above; off when
    # metacheck_psyarxiv_reports is "0".
    - name: Install the PsyArXiv reports service and timer
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        owner: root
        group: root
        mode: "0644"
        content: "{{ item.content }}"
      loop:
        - name: metacheck-psyarxiv-reports.service
          content: |
            # Managed by the metacheck SURF Research Cloud component.
            [Unit]
            Description=metacheck: reports on the newest PsyArXiv preprints (prototype)
            After=metacheck-api.service
            Requires=metacheck-api.service
            [Service]
            Type=oneshot
            User=shiny
            Group=shiny
            Environment=HOME=/home/shiny
            Environment=METACHECK_API_LOCAL=http://127.0.0.1:{{ metacheck_api_port }}
            WorkingDirectory={{ metacheck_component_dir }}/api
            ExecStart=/usr/bin/Rscript {{ metacheck_component_dir }}/api/psyarxiv-reports-generate.R
            Nice=10
        - name: metacheck-psyarxiv-reports.timer
          content: |
            # Managed by the metacheck SURF Research Cloud component.
            [Unit]
            Description=metacheck: reports on the newest PsyArXiv preprints, every hour
            [Timer]
            OnBootSec=15min
            OnUnitInactiveSec=1h
            [Install]
            WantedBy=timers.target

    - name: Switch the PsyArXiv reports on or off (metacheck_psyarxiv_reports = {{ metacheck_psyarxiv_reports }})
      ansible.builtin.systemd:
        name: metacheck-psyarxiv-reports.timer
        enabled: "{{ (metacheck_psyarxiv_reports | int) > 0 }}"
        state: "{{ 'started' if (metacheck_psyarxiv_reports | int) > 0 else 'stopped' }}"
        daemon_reload: true

    # ------------------------------------------------------------------
    # Installing new versions by itself (metacheck_auto_update)
    # ------------------------------------------------------------------
    - name: Install the automatic update command
      ansible.builtin.copy:
        src: files/metacheck/metacheck-auto-update
        dest: /usr/local/sbin/metacheck-auto-update
        owner: root
        group: root
        mode: "0755"

    - name: Write the automatic update settings
      ansible.builtin.template:
        src: templates/metacheck/auto-update.conf.j2
        dest: /etc/metacheck-auto-update.conf
        owner: root
        group: root
        mode: "0644"

    - name: Install the automatic update service and timer
      ansible.builtin.copy:
        src: "files/metacheck/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - metacheck-auto-update.service
        - metacheck-auto-update.timer

    - name: Switch automatic updates on or off (metacheck_auto_update = {{ metacheck_auto_update }})
      ansible.builtin.systemd:
        name: metacheck-auto-update.timer
        enabled: "{{ metacheck_auto_update | bool }}"
        state: "{{ 'started' if (metacheck_auto_update | bool) else 'stopped' }}"
        daemon_reload: true

    # ------------------------------------------------------------------
    # nginx (only when the SRC-Nginx component configured the workspace)
    # ------------------------------------------------------------------
    - name: Check for the SRC-Nginx location directory
      ansible.builtin.stat:
        path: /etc/nginx/app-location-conf.d
      register: nginx_locations

    # Two variants of the app's nginx file (SRAM login / open to anyone);
    # the switch `metacheck-public on|off` puts one of them in place.
    - name: Create the folder for the nginx variants
      ansible.builtin.file:
        path: "{{ metacheck_component_dir }}/nginx"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: nginx_locations.stat.exists

    - name: Prepare the nginx variants of the app (login and public)
      ansible.builtin.template:
        src: templates/metacheck/metacheck-nginx.conf.j2
        dest: "{{ metacheck_component_dir }}/nginx/metacheck-{{ item.name }}.conf"
        owner: root
        group: root
        mode: "0644"
      vars:
        metacheck_nginx_public: "{{ item.public }}"
      loop:
        - { name: login, public: false }
        - { name: public, public: true }
      when: nginx_locations.stat.exists
      register: metacheck_variants

    - name: Install the per-visitor limit for the public app
      ansible.builtin.copy:
        src: files/metacheck/metacheck-public-limit.conf
        dest: /etc/nginx/conf.d/metacheck-public-limit.conf
        owner: root
        group: root
        mode: "0644"
      when: nginx_locations.stat.exists
      register: metacheck_limit

    - name: Install the switch `metacheck-public on|off|status`
      ansible.builtin.copy:
        src: files/metacheck/metacheck-public
        dest: /usr/local/sbin/metacheck-public
        owner: root
        group: root
        mode: "0755"
      when: nginx_locations.stat.exists

    - name: Read whether the app is public now
      ansible.builtin.command: /usr/local/sbin/metacheck-public status
      register: metacheck_public_state
      changed_when: false
      when: nginx_locations.stat.exists

    # Puts the chosen variant in place (and reloads nginx) when the state
    # differs, when no variant is in place yet, or when the variants changed.
    - name: Open or close the app (metacheck_public = {{ metacheck_public }})
      ansible.builtin.command: /usr/local/sbin/metacheck-public {{ 'on' if metacheck_public | bool else 'off' }}
      when: >-
        nginx_locations.stat.exists and (
          (metacheck_public | bool) != ('open' in metacheck_public_state.stdout)
          or metacheck_variants.changed or metacheck_limit.changed)
      register: metacheck_nginx

    - name: Show the website at the workspace root, and its check pages at short addresses
      ansible.builtin.copy:
        dest: /etc/nginx/app-location-conf.d/00-root.conf
        mode: "0644"
        content: |
          # Managed by the scienceverse/surf-research-cloud components.
          # The root shows the metacheck website (location /site/, which also
          # decides whether a login is needed), and /datamanager/,
          # /researchbox/ and /psyarxiv/ show its check pages (site/<page>/),
          # through the same location.
          location = / {
              rewrite ^ /site/ last;
          }
          location ~ ^/(datamanager|researchbox|psyarxiv|psyarxiv-reports)$ {
              return 301 /$1/;
          }
          location ~ ^/(datamanager|researchbox|psyarxiv|psyarxiv-reports)/(.*)$ {
              rewrite ^/(datamanager|researchbox|psyarxiv|psyarxiv-reports)/(.*)$ /site/$1/$2 last;
          }
      when: nginx_locations.stat.exists
      register: root_nginx

    - name: Check and reload nginx
      ansible.builtin.shell: nginx -t && systemctl reload nginx
      when: nginx_locations.stat.exists and (metacheck_nginx.changed or root_nginx.changed)

    - name: Note the absence of SRC-Nginx
      ansible.builtin.debug:
        msg: "SRC-Nginx is not installed: the app is only reachable on the workspace itself (http://127.0.0.1:{{ metacheck_shiny_port }}/metacheck/)."
      when: not nginx_locations.stat.exists

    - name: Free disk space
      ansible.builtin.include_tasks: tasks/cleanup.yml

    - name: Let automatic updates run again
      ansible.builtin.shell: |
        systemctl stop metacheck-playbook-hold 2>/dev/null || true
        rm -f /run/metacheck-playbook-hold.ok
      changed_when: false

    - name: Update status file
      ansible.builtin.lineinfile:
        path: "{{ status_file }}"
        line: "{{ lookup('pipe', 'date \"+%Y-%m-%d %H:%M:%S\"') }}  metacheck component: installed"

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "metacheck paper report app: /metacheck/ on the workspace URL (Shiny Server on 127.0.0.1:{{ metacheck_shiny_port }})"
          - "{{ ('PDF conversion: bibr at ' ~ metacheck_bibr_url_value) if metacheck_bibr_url_value | length > 0 else 'PDF conversion: GROBID servers (no bibr configured)' }}"
          - "{{ ('Local model for the power check: ' ~ metacheck_llm_model ~ ' at ' ~ ollama_url) if metacheck_local_llm | bool else (('Model for the power check: ' ~ metacheck_llm_model ~ ' on the bibr workspace, ' ~ metacheck_shared_llm_url) if metacheck_shared_llm | bool else (('Model for the power check: ' ~ metacheck_llm_model ~ ' on ' ~ metacheck_llm_name_value ~ ', ' ~ metacheck_url_llm_base) if metacheck_url_llm | bool else 'No model for the power check')) }}"
          - "Web interface: {{ metacheck_api_workers }} job(s) at a time{{ (', the code of each with at most ' ~ metacheck_sandbox_cpus_value ~ ' processors and ' ~ metacheck_sandbox_memory_mb ~ ' MB') if metacheck_sandbox_on | bool else ', no code is run' }}"
